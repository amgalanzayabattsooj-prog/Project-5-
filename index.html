<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Umrah Quote</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <div class="card">

    <div class="left"></div>

    <div class="right">
      <h1>Get Umrah Quote</h1>
      <p class="subtitle">All-Inclusive Umrah Package</p>

      <div class="field">
        <label>Lead Passenger Name:</label>
        <input type="text" placeholder="Mohammad Ali">
      </div>

      <div class="field">
        <label>Enter Active Number:</label>
        <input type="text" placeholder="+44 203 123 4567">
      </div>

      <div class="field">
        <label>Enter Email:</label>
        <input type="email" placeholder="myemail@gmail.com">
      </div>

      <div class="field">
        <label>Total Passengers:</label>
        <input type="text" placeholder="i.e 2 adults & 2 kid">
      </div>

      <div class="accept">
        <span>I accept the <a href="#">Privacy Policy</a></span>
        <input type="checkbox">
      </div>

      <button>Submit</button>
    </div>

  </div>

</body>
</html>
